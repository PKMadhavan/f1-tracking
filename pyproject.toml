[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-tracking"
version = "1.0.0"
description = "YOLOv8 + DeepSORT pipeline for detecting and tracking Formula 1 cars in race footage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Madhavan Panneerselvam Kumar" }]
dependencies = [
    "ultralytics==8.2.0",
    "deep-sort-realtime==1.3.2",
    "opencv-python-headless==4.9.0.80",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # torch here is built against the numpy 1.x ABI; importing it under numpy 2.x
    # prints "Failed to initialize NumPy" and risks a crash.
    "numpy>=1.24.0,<2",
    "motmetrics==1.4.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[project.scripts]
f1-track = "f1_tracking.cli:main"
f1-gt = "f1_tracking.ground_truth:main"
f1-compare = "f1_tracking.benchmark:main"
f1-analyze = "f1_tracking.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
