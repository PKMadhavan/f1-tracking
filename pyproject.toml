[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-tracking"
version = "1.0.0"
description = "YOLOv8 + DeepSORT pipeline for detecting and tracking Formula 1 cars in race footage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Madhavan Panneerselvam Kumar" }]
dependencies = [
    "ultralytics==8.2.0",
    "deep-sort-realtime==1.3.2",
    "opencv-python-headless==4.9.0.80",
    # deep-sort-realtime unconditionally depends on unpinned "opencv-python"
    # (GUI variant), which installs into the same cv2/ namespace as headless
    # and silently overwrites it. The version pip picked (5.0.0.93) has no
    # FFMPEG support, breaking video writing. Pin both to the same version.
    "opencv-python==4.9.0.80",
    # torch>=2.3 has no macOS x86_64 wheels on PyPI (Apple Silicon only past
    # this point), so cap here for Intel Mac / CI portability.
    "torch>=2.0.0,<2.3.0",
    "torchvision>=0.15.0,<0.18.0",
    # torch here is built against the numpy 1.x ABI; importing it under numpy 2.x
    # prints "Failed to initialize NumPy" and risks a crash.
    "numpy>=1.24.0,<2",
    # motmetrics pulls in scipy unpinned; latest scipy requires numpy>=2, which
    # directly conflicts with the numpy<2 pin above. Cap to the last scipy
    # series that still supports numpy 1.x.
    "scipy>=1.10,<1.14",
    "motmetrics==1.4.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[project.scripts]
f1-track = "f1_tracking.cli:main"
f1-gt = "f1_tracking.ground_truth:main"
f1-compare = "f1_tracking.benchmark:main"
f1-analyze = "f1_tracking.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
